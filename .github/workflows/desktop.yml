name: Desktop installers
on:
  push:
    branches: [main, codex/ls-trim-overview]
    paths:
      - 'desktop/**'
      - 'simulator/**'
      - 'package*.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac-arm64
            build: dist:mac
          - os: windows-latest
            target: windows-x64
            build: dist:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare Electron executable (retry transient download failures)
        run: npm run setup:electron
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - run: npm test
      - name: Native Electron two-window test
        run: npm run test:desktop
      - name: Build installer and portable ZIP
        run: npm run ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Native packaged Windows test
        if: runner.os == 'Windows'
        run: npm run test:desktop
        env:
          ORPHEIA_PACKAGED_EXECUTABLE: dist/win-unpacked/ORPHEIA CTC LAB.exe
      - name: Native packaged M1 test
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: npm run test:desktop
        env:
          ORPHEIA_PACKAGED_EXECUTABLE: dist/mac-arm64/ORPHEIA CTC LAB.app/Contents/MacOS/ORPHEIA CTC LAB
      - name: Verify packaged files
        run: node desktop/check-package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ORPHEIA-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-diagnostics-${{ matrix.target }}
          path: test-results/
          if-no-files-found: ignore
  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ORPHEIA-*
          merge-multiple: true
          path: installers
      - name: Publish a new version after both native builds pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; existing downloads are preserved."
            exit 0
          fi
          # 릴리즈 본문에는 이번 버전 항목만 싣는다 (파일 전체 이력을 싣지 않음)
          awk -v v="v${version}" 'index($0,v)==1 && substr($0,length(v)+1,1)~/[: ]|^$/ {on=1} on && /^v[0-9]/ && index($0,v)!=1 {exit} on' desktop/release-notes.md > current-notes.md
          [ -s current-notes.md ] || echo "v${version}" > current-notes.md
          gh release create "$tag" installers/* --target "$GITHUB_SHA" --title "ORPHEIA CTC LAB ${version}" --notes-file current-notes.md
